<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42.65 38.5">
<metadata>
  Source of paradox-mods-solid.svg, a small-size cut of the game's Media/Glyphs/ParadoxMods.svg
  for the 20-24rem icons: a filled hexagon with the skeleton cut out, sharp at that size.

  The three paths paint the icon as it renders (the hole in white for preview):
  - hex: the glyph's hexagon, its corners tightened to a 2.5-unit radius.
  - hole: the skeleton, both halves of the game glyph's split design joined into one cutout,
    widened by a 0.4-unit stroke so its features reach about 2px, then simplified three times.
  - eye: the game glyph's eye, unchanged.

  To rebuild the shipped icon from this file:
    inkscape paradox-mods-solid.source.svg \
      --actions="select-by-id:hex,hole;path-difference;select-clear;select-all;path-union" \
      --export-type=svg --export-plain-svg --export-filename=/tmp/paradox-mods-solid.svg
    bunx svgo -p 1 --multipass -i /tmp/paradox-mods-solid.svg -o paradox-mods-solid.svg
  then restore the viewBox svgo rounds to one decimal: 0 0 42.65 38.5.
</metadata>
